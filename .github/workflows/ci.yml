name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  database:
    # Real RLS/security tests and the generated-types contract (ADR-002 §4,
    # §10) against a throwaway local Supabase stack on the runner. Never
    # touches a remote project.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start local Supabase (applies all migrations from zero)
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      - run: npm run db:test
      - run: npm run db:types:check

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    # LB-04 auth/membership, LB-05 checklist and LB-06 planning/settings journeys in a
    # real browser against the production build and a throwaway local Supabase stack on the runner
    # (auto-confirmed sign-ups, see supabase/config.toml). Never touches a
    # remote project; playwright.config.ts refuses non-local Supabase URLs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start local Supabase (applies all migrations from zero)
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # No trace/report artifacts: their DOM snapshots would contain invite
      # links (bearer tokens), even if only for this throwaway database.

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
